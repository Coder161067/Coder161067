<svg xmlns="http://www.w3.org/2000/svg" width="72" height="32" viewBox="0 0 72 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1a1b27"/>
      <animate attributeName="x1" values="-1;1;-1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="72" height="32" rx="6" fill="url(#bg)" stroke="#30363d" stroke-width="0.5"/>

  <!-- Glow border pulse -->
  <rect width="72" height="32" rx="6" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan line -->
  <rect x="0" y="0" width="72" height="6" fill="url(#scan)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 -6;0 38;0 -6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Dot pulse -->
  <circle cx="14" cy="16" r="3" fill="#58a6ff" opacity="0.8">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ghost dot -->
  <circle cx="14" cy="16" r="6" fill="#58a6ff" opacity="0.15" filter="url(#blur)">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="24" y="13" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="9" fill="#8b949e" opacity="0.9">
    VISITORS
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Count -->
  <text x="24" y="25" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="14" font-weight="bold" fill="#c9d1d9">
    8
    <animate attributeName="fill" values="#c9d1d9;#58a6ff;#c9d1d9" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Count glow -->
  <text x="24" y="25" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" filter="url(#blur)" opacity="0.3">
    8
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
